name: Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate source structure
        run: test -f src/Main.jsx && test -f build/build.js

      - name: Run unit tests
        run: npm test

      - name: Static validation (ES3 + build)
        run: |
          npm run validate:es3 || true
          npm run validate:build || true

      - name: Build JSX
        run: |
          npm run build
          SOURCE_DATE_EPOCH=${{ github.event.release.published_at || github.event.head_commit.timestamp || '' }} npm run build

      - name: Package release metadata
        run: SOURCE_DATE_EPOCH=${{ github.event.release.published_at || github.event.head_commit.timestamp || '' }} node scripts/package-release.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssm-pro-jsx
          path: |
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx.sha256
            dist/release-meta.json

      - name: Publish release asset (on release)
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx \
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx.sha256 \
            dist/release-meta.json --clobber || true

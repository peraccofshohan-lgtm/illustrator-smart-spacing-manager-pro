name: CI Pipeline

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Build JSX (reproducible)
        run: npm run build
      - run: npm run validate:es3
      - run: npm run validate:build
      - name: Package release metadata
        run: node scripts/package-release.js
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssm-pro-jsx
          path: |
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx.sha256
            dist/release-meta.json
      - name: Publish release assets (on release)
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx \
            dist/Illustrator_Smart_Spacing_Manager_Pro.jsx.sha256 \
            dist/release-meta.json --clobber
      - name: Verify release assets via API
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_COUNT=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" --jq '.assets | length')
          echo "Release asset count: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -lt 3 ]; then
            echo "ERROR: Expected at least 3 assets, found $ASSET_COUNT" >&2
            exit 1
          fi
